<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F8F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E181C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="BeanParts fake-data UI prototype for FRC Team BEAN 1833. Nothing here is saved to Google Sheets." />
    <title>BeanParts Prototype</title>
    <link rel="icon" type="image/png" href="./bean-logo-primary.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="proto-note" role="note">
      Prototype with fake data. Nothing is saved to Google Sheets.
    </div>

    <header class="topbar" id="topbar" hidden>
      <div class="topbar-inner">
        <a class="brand" href="#projects" aria-label="BeanParts projects">
          <img src="./bean-logo-primary.png" alt="Team BEAN 1833" width="34" height="34" />
          <span class="wordmark">BeanParts</span>
        </a>

        <button class="project-switch" id="projectSwitch" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="projectMenu">
          <span class="project-switch-label">Project</span>
          <span class="project-switch-name" id="projectSwitchName">2026 Onseason Robot</span>
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
        </button>

        <nav class="mainnav" id="mainnav" aria-label="Main">
          <a href="#overview" data-nav="overview">Overview</a>
          <a href="#bom" data-nav="bom">BOM</a>
          <a href="#requests" data-nav="requests" data-needs="reviewer">Requests</a>
          <a href="#orders" data-nav="orders">Orders</a>
          <a href="#deliveries" data-nav="deliveries">Deliveries</a>
        </nav>

        <form class="global-search" id="globalSearchForm" role="search">
          <label class="sr-only" for="globalSearch">Search parts, requests, and orders</label>
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="globalSearch" type="search" placeholder="Search parts, requests, orders" autocomplete="off" />
        </form>

        <label class="role-preview" title="Prototype only: view the app as a different role">
          <span>Preview as</span>
          <select id="rolePreview" aria-label="Preview as role">
            <option value="student">Student</option>
            <option value="lead">Lead</option>
            <option value="mentor">Mentor</option>
          </select>
        </label>

        <button class="account" id="accountButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu" aria-label="Account menu">
          <span id="accountInitials">PS</span>
        </button>
      </div>

      <div class="menu project-menu" id="projectMenu" role="listbox" aria-label="Switch project" hidden></div>
      <div class="menu account-menu" id="accountMenu" role="menu" aria-label="Account" hidden></div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="bottomnav" id="bottomnav" aria-label="Main" hidden>
      <a href="#overview" data-nav="overview"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg><span>Overview</span></a>
      <a href="#bom" data-nav="bom"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>BOM</span></a>
      <a href="#requests" data-nav="requests" data-needs="reviewer"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg><span>Requests</span></a>
      <a href="#orders" data-nav="orders"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16v13H4zM8 7V4h8v3M4 11h16"/></svg><span>Orders</span></a>
      <button type="button" id="moreButton" aria-haspopup="dialog"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
    </nav>

    <div class="sheet" id="moreSheet" role="dialog" aria-modal="true" aria-label="More" hidden>
      <button class="sheet-backdrop" type="button" data-action="close-sheet" aria-label="Close"></button>
      <div class="sheet-panel">
        <div class="sheet-grab" aria-hidden="true"></div>
        <a href="#deliveries" class="sheet-item"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7zM7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>Deliveries</a>
        <a href="#projects" class="sheet-item"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Projects</a>
        <a href="#settings" class="sheet-item"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div id="dialogHost"></div>

    <script src="./app.js"></script>
  </body>
</html>
